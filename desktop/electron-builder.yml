appId: com.escudodigital.app
productName: Escudo Digital
copyright: © Escudo Digital

directories:
  output: dist
  buildResources: build

# Solo empaquetamos el shell; la UI se carga desde la web publicada.
files:
  - main.js
  - preload.js
  - package.json

# electron-builder genera .ico y .icns a partir de build/icon.png (1024x1024).
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: build/icon.png

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  category: Office
  maintainer: Escudo Digital <soporte@escudodigital.cr>
  target:
    - AppImage
    - deb
  icon: build/icon.png

# Sin auto-publicación por ahora; los instaladores se suben como artefactos de CI.
publish: null
